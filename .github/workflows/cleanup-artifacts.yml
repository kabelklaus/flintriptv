name: Cleanup Legacy Artifacts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List only (true) or delete all artifacts (false)"
        required: true
        default: true
        type: boolean

jobs:
  cleanup:
    name: Cleanup repository artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: List or delete all artifacts
        id: cleanup
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const dryRunInput = String(process.env.DRY_RUN || "true").toLowerCase();
            const dryRun = dryRunInput === "true" || dryRunInput === "1" || dryRunInput === "yes";

            let found = 0;
            let deleted = 0;
            let page = 1;
            const perPage = 100;

            while (true) {
              const response = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: perPage,
                page
              });

              const artifacts = response.data.artifacts || [];
              if (artifacts.length === 0) {
                break;
              }

              for (const artifact of artifacts) {
                found += 1;
                core.info(`${dryRun ? "[DRY RUN]" : "[DELETE]"} ${artifact.id} ${artifact.name}`);

                if (!dryRun) {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  deleted += 1;
                }
              }

              if (artifacts.length < perPage) {
                break;
              }

              page += 1;
            }

            core.setOutput("found", String(found));
            core.setOutput("deleted", String(deleted));

            await core.summary
              .addHeading("Artifact Cleanup")
              .addTable([
                [{ data: "mode", header: true }, dryRun ? "dry_run" : "delete"],
                [{ data: "found", header: true }, String(found)],
                [{ data: "deleted", header: true }, String(deleted)]
              ])
              .write();

      - name: Print result
        run: |
          echo "found=${{ steps.cleanup.outputs.found }}"
          echo "deleted=${{ steps.cleanup.outputs.deleted }}"
